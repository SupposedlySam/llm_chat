# Deploy from this directory: `fly deploy`. Secrets (never in this file):
#   fly secrets set CF_TEAM_DOMAIN=<team>.cloudflareaccess.com \
#     CF_ACCESS_AUD=<the Access application's AUD tag> \
#     HUB_NAMESPACES='{"<jonah client id>": "jonah", "<morgan client id>": "morgan"}'
app = "llm-chat-hub"
primary_region = "iad"

[build]

[env]
  HUB_AUTH = "access"
  HUB_DB = "/data/hub.db"
  HUB_ROOMS = "wcs-desk"

[mounts]
  source = "hub_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # One machine, always on: SQLite on one volume has exactly one writer, and
  # a bridge polling every few seconds would wake a stopped machine anyway.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
