# WHAT MUST BE RUN WHEN A THING CHANGES.
#
# The rule this encodes: if a change has an OUTPUT that is not the thing you edited — a code
# generator, template, migration, schema, serializer, IaC, build script — no verification counts
# until the output's real consumer has consumed it. A generator's own test comparing emitted text to
# emitted text, an analyzer configured to exclude the output dir, a downstream that exercises none of
# the changed code: three green signals, all vacuous, none lying.
#
# FORMAT:  <glob>: [<command>, ...]   — commands run from the repo root.
# A `<glob>/**` entry matches anything under that directory.
# The commands must FAIL when the change is broken. A command that cannot fail is not a check.
#
# Coverage is computed the other way round from the map: every changed path counts as UNCHECKED
# until a rule claims it or `unchecked-ok` excludes it. Ask at any time:
#
#     ./.game_loop/bin/verify --coverage
#
# WHAT THESE CHECKS MISS — stated here because a rail goes quiet exactly where it is blind.
#
# THIS PARAGRAPH WAS ITSELF OUT OF DATE, which is the point showrunner made in #learnings: a stated
# limit ages exactly like a stated premise, and only one of them ever gets re-checked. It said green
# meant "it parses, never it works", because the gate was `py_compile` — a syntax check that does
# not resolve names, and so would not have caught the missing `import subprocess` that shipped in
# `setup` and crashed on its first real call. That was true when it was written. Nothing has run
# py_compile since the suite replaced it (see below): every Python path is now covered by
# `test/run.py --min 85`, which executes the code rather than parsing it (the mutation sweep that
# used to run beside it is now nightly — see the long note further down). The
# caveat outlived the check it described, and a reader trusting it would have UNDER-trusted a green
# run for weeks.
#
# What is actually missed now, re-derived rather than inherited:
#   - `bash -n` on the two shell scripts is still only a syntax gate. install.sh's real behaviour is
#     covered by test_shell.py; legacy_teardown.sh's is too, but neither is exercised on a machine
#     that differs from this one (a different Claude Code layout, a missing `claude` binary in a
#     place we did not think of).
#   - `./zonai compile` catches a table with rules and no row-rules; it does NOT catch a renamed
#     column, which is why contract.py runs beside it.
#   - Nothing here runs the MCP server against a real client, only against its own schema.
#
# When one of these stops being true, delete the line rather than leaving it to age.

# THE MUTATION SWEEP IS NO LONGER A GATE. It is still the check that makes the
# coverage floor mean something — it reverts fixes this project actually shipped
# and requires the suite to go RED for each, and a mutation that SURVIVES is the
# finding: covered, green, and undefended, which is the exact false comfort a
# coverage number invites. None of that changed. What changed is WHERE it runs.
#
# The comment here used to say "2.4s, measured, so it is affordable per changed
# pattern; if it stops being affordable that is a reason to split it, not to
# drop it." That number was true when it was written and is now off by orders
# of magnitude: the table has grown past 230 mutations, each one reverts a fix
# and re-runs the WHOLE suite, and the suite alone is ~90s. Even self-sharded
# across eight workers the sweep does not finish inside a ten-minute window. It
# was the single largest cost of touching anything under bin/, test/ or
# triggers/, and it gates nothing that a human is waiting on.
#
# THAT IS THE ARGUMENT ITS OWN OLD COMMENT MADE, followed properly. "A reason
# to split it, not to drop it" — this does not drop it. It moves it to
# .github/workflows/mutation-sweep.yml, nightly, where it files ONE issue when
# a behaviour stops being defended. The finding still arrives; it stops arriving
# in front of somebody trying to commit. A gate expensive enough to be worked
# around is worse than a scheduled job that is actually read, and this one was
# being worked around by killing it mid-run.
#
# WHAT LEAVING THE GATE COSTS, stated rather than glossed: an undefended
# behaviour now ships and is caught the following morning instead of at the
# commit that introduced it. The accounting half is what stays behind — the
# suite's own test_gate.AccountingClosesTest still fails when a producer is
# neither swept nor excluded with a reason, and that check is fast because it
# reads the table rather than running it. So "nobody decided about this
# function" is still a commit-time failure; only "the suite would not notice"
# moved to the night.
#
# `--min 85` IS A FLOOR, AND THE POINT IS WHICH 85. This line used to say 100,
# and the paragraph around it was written for that number — at 100 the gate
# could claim "no line is unvisited", and at 85 it cannot. Leaving the old
# sentence would be the same prose-outliving-its-check failure that left
# `./zonai compile` shelling out bare for months while the comment three lines
# above it said the command exits 0 on failure.
#
# WHAT WE ACTUALLY WANT TESTED IS THE IMPORTANT LOGIC. The decisions, the
# branches that can be wrong in a way nobody notices, the wire conventions, the
# refusals — anything where a silent wrong answer is possible. The obvious
# simple stuff does not need a test: a print, a getter, straight-line plumbing
# that either runs or visibly does not. A test written to walk a trivial line
# buys a number and defends nothing, and the effort it costs is taken from the
# logic that does need defending.
#
# So the floor is set where it stops a suite ROTTING WHOLESALE — a commit that
# guts coverage still fails — while leaving the judgment about what deserves a
# test to a human rather than to an arithmetic target. It deliberately gives up
# the guarantee that every new branch fails the commit that adds it.
#
# WHICH MAKES MUTATE.PY THE LOAD-BEARING HALF, not the decorative one. Coverage
# never could say a test would fail if the behaviour broke; it only ever said a
# line was visited. The mutation sweep is what asserts the suite would NOTICE,
# and it is aimed at exactly the important logic this paragraph is about — so
# its accounting must stay closed: every candidate either swept, or excluded
# with a reason somebody wrote down. The runner prints the caveat on every run
# so the number is never read as a claim about correctness.
#
# The suite REPLACES the old py_compile gates rather than joining them: it
# loads every script in bin/, so a syntax error fails it too, and it additionally
# fails when a behaviour breaks. A syntax gate that a stronger check subsumes is
# just a second thing to keep passing.
#
# Still not a catch-all "*". verify runs each stale pattern independently, so a
# single "*" would make every commit pay for the whole suite once per changed
# pattern — reported as game_loop#37, where two rules took a repo from seconds
# to minutes. Directory-scoped globs give the completeness without that cost.
#
# ONE rule for all of bin/, not one per script. It was three named files, and
# bin/llm-chat-slack — added later — matched none of them, so the Slack bridge
# was UNCHECKED from the day it was written while every commit reported clean.
# That is the same defect already fixed twice in the test tooling this rule
# invokes: a hand-written list of files is complete today and complete BY
# ACCIDENT. A glob has no next file to forget.
#
# Cheaper too, not more expensive: verify runs each stale PATTERN once, so
# collapsing three patterns into one means a commit touching two scripts pays
# for the suite once instead of twice.
"bin/**":
  - "python3 test/run.py --min 85"

# A change to the tests themselves must run them. Otherwise a broken or
# vacuous test can be committed with the gate reporting clean, which is the
# exact failure the coverage report exists to surface.
"test/**":
  - "python3 test/run.py --min 85"
  - "python3 test/contract.py"

# The game_loop triggers. They run inside ANOTHER tool's loop, on somebody
# else's schedule, and their output goes to every agent in a shared room — so a
# regression here is not noticed by the person who caused it. Same gate as the
# entrypoints; they are in the same coverage and mutation denominator.
"triggers/**":
  - "python3 test/run.py --min 85"

"install.sh":
  - "bash -n install.sh"

# `bash -n` earns its place here: the first draft of this script died at PARSE
# time, before doing anything, because of parentheses in a heredoc nested in a
# command substitution. A syntax gate catches exactly that class.
"legacy_teardown.sh":
  - "bash -n legacy_teardown.sh"

# `./zonai compile` catches a table with rules and no row-rules. It does NOT
# catch a renamed column: the Dart stays perfectly valid, and the Python suite
# stays green because it runs against a fake that accepts whatever column it is
# asked for. Demonstrated by renaming from_identity in messages.dart — 205 tests
# passed, the contract check named the column. That gap is the reason both run.
#
# Schemas and rules are compiled into worker executables, so the compiler is their real consumer —
# not a test of the Dart source in isolation. It fails on a table that has table-rules and no
# row-rules, which is a runtime error this project has already hit once.
# `./zonai compile` WAS WRITTEN HERE AS A BARE COMMAND, and a bare command is a
# check that cannot fail. Measured, not inferred: a merge that changed
# pubspec.lock without re-resolving left .dart_tool pointing at the old
# zonai_schema, compile printed 33 `Error:` lines, "Failed to compile" for every
# worker, and "Bad state: Generating AOT kernel dill failed!" — and EXITED 0.
#
# The bitter part is that the comment directly above this rule already said it
# exits 0, and said it twice, and the rule still shelled out to it bare. A
# limitation written in prose beside the gate is not in the gate. So the exit
# code is supplied here from the OUTPUT, which is the only place the failure is
# actually reported.
#
# `dart pub get` runs first because compile against a stale .dart_tool is the
# exact failure above, and it is a no-op when deps are already resolved. Note
# what this still misses: compile catches a table with rules and no row-rules,
# and does NOT catch a renamed column — which is why contract.py runs beside it.
"lib/**":
  - "dart pub get >/dev/null 2>&1 || exit 1; out=$(./zonai compile 2>&1); printf '%s\n' \"$out\"; case \"$out\" in *'Failed to compile'*|*'AOT compilation failed'*|*'Compiled 0 rules'*) exit 1;; esac"
  - "python3 test/contract.py"

# Genuinely nothing to check. Anything neither listed here nor matched above stays UNCHECKED and
# says so on every commit that touches it — including `.zonai/migrations/**`, deliberately: the only
# real check for a migration is applying it, and a commit gate that mutates the database is worse
# than an honest "unchecked".
# ONE decision written in three files: the vendored fat `zonai` binary, `version:` in zonai.yaml,
# and the zonai_schema `ref:` in pubspec.yaml. They were all UNCHECKED — the commit that upgraded
# them said so, which is how this rule got written.
#
# Disagreement does not fail in one place, it fails in three different ways, and only one of them
# is honest. Binary vs zonai.yaml refuses every command with "Version mismatch". Binary vs schema
# ref does NOT refuse: `zonai compile` prints "Failed to compile rules:" and EXITS 0, so the
# bootstrap continues and serves with no rules worker, and every /db request returns 500 — which
# reads as a wire bug rather than a build one. That is exactly how the 0.6.2 upgrade presented.
#
# The README and llms.txt both say "bump all three or none". This is that sentence, enforced.
"zonai.yaml":
  - "python3 test/test_pins.py"
"pubspec.yaml":
  - "python3 test/test_pins.py"
"zonai":
  - "python3 test/test_pins.py"

# The ONE tracked file whose contents execute in a stranger's checkout. It is
# deliberately not gitignored — game_loop's hooks are written as
# "$CLAUDE_PROJECT_DIR"/... and are portable — which makes an absolute path in
# it a command firing on a cloner's every tool call against a directory only
# this machine has. That has happened here, reported by an agent who had to
# lift one out by hand before pushing.
#
# It matched no rule until the upgraded verify said so, which is a better
# failure than the silence it replaced.
".claude/settings.json":
  - "python3 test/test_settings.py"

# showrunner's config is SOURCE, and it is the file that decides whether a
# Crawler can work at all. `doctor` is a real check rather than a description:
# it exits 2 on a worktree_root outside the repo (every Crawler's per-agent
# write guard would deny its first edit) and on a worktree-relative lock_root
# (a mutex that is quietly a no-op). Probed here, not assumed — pointing
# worktree_root at /tmp made it exit 2 and name the consequence.
".showrunner/config.json":
  - "./.showrunner/bin/showrunner doctor"

# These cross into every worktree, and a worktree is the ONE place they run —
# so a syntax error here is invisible in the checkout that authored it and
# fatal everywhere it matters. `bash -n` is only a parse gate and does not
# resolve a name or run a branch; it is claimed as nothing more. The loop
# fails on the first bad file rather than the last, so the exit code is the
# script's own.
".showrunner/hooks/**":
  - "for f in .showrunner/hooks/*.sh; do bash -n \"$f\" || exit 1; done"


# AN ENTRY HERE IS A DECISION RECORD, not a shrug. It says somebody looked at
# this path and concluded no command could meaningfully FAIL on it. UNCHECKED
# — the state of anything neither matched above nor listed here — says nobody
# has decided yet, and that is the honest default: `bin/llm-chat-slack` was
# UNCHECKED from the day it was written while every commit reported clean, and
# `.claude/settings.json` matched no rule until that line said so.
#
# The distinction matters in both directions. Leaving a path UNCHECKED after
# somebody HAS decided about it is inaccurate, and it spends the reader's
# attention on a line that will never become actionable. Listing one here that
# a command COULD have failed on is worse: it launders a gap into a decision.
#
# LICENSE is the first kind. No command can fail on licence text — there is
# nothing to run — so it is declared rather than left looking undecided.
# Added on the human's authorization, recorded in .game_loop/log.jsonl:
# "You can put the decision as unchecked ok for the liscense".
#
# `.github/**` is deliberately NOT here. A workflow CAN be checked — its
# claims are asserted in test_wiring — so it stays UNCHECKED on purpose,
# reported on every commit that touches it. That was his call too.
"unchecked-ok":
  - "*.md"
  - "llms.txt"
  - ".gitignore"
  - "pubspec.lock"
  - ".game_loop/**"
  - "LICENSE"
  - ".showrunner/.gitignore"
