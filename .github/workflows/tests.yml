# Run the suite somewhere that is not the maintainer's laptop.
#
# WHY THIS EXISTS. Until it did, the only thing that ran these tests was
# game_loop's commit gate — which is real, and enforced, and refuses a commit
# whose checks have not run since the change. It is also LOCAL: it depends on
# game_loop being installed, on the hook being registered in that session, and
# on the commit happening on this machine. A clone, a pull request, or a
# contributor gets none of it, and the suite had only ever run in one warm
# tree.
#
# That is not theoretical. flutter-device posted the practice to #learnings —
# "run the suite from a COLD clone before believing any claim about coverage"
# — and doing so immediately found two tests that were green here and red
# there: `start_server` stubs `subprocess` and then reads the real filesystem
# for gitignored build artifacts, so the tests passed only because this
# machine had compiled at some point. A suite you have only run in a warm tree
# is a suite whose entry point is untested.
#
# WHAT THIS DOES NOT DO, said out loud because an unstated omission is exactly
# the failure this repo keeps removing:
#
#   · It does NOT run the mutation sweep. That is the check that says whether
#     a behaviour is DEFENDED rather than merely covered, and it is the more
#     valuable of the two — but it reverts every fix in its table and runs the
#     whole suite against each, self-sharded, and takes tens of minutes. This
#     paragraph used to end "It stays on the commit gate." It no longer does:
#     it was the largest cost of touching bin/, test/ or triggers/, gated
#     nothing anybody was waiting on, and was being killed mid-run rather than
#     obeyed. It is now `.github/workflows/mutation-sweep.yml`, nightly, and
#     it files one issue. A green tick here means the tests pass, not that the
#     tests would notice if the code broke — and that second question is now
#     answered the following morning rather than at the commit.
#   · Some tests SKIP here and run locally: the macOS-only reload path, the
#     ones needing the `claude` CLI, and the ones reading a gitignored
#     per-machine config. They announce their reason rather than vanishing,
#     and the count is printed below on purpose.
#
# So this is the cheap half. It catches "nothing runs at all", which is the
# failure that hides best.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  # BY HAND, because a run that never started cannot be restarted. A commit
  # here came back `startup_failure` at 0s — GitHub could not launch the job
  # at all — and `gh run rerun` refuses those: "This workflow run cannot be
  # retried". With only push and pull_request triggers there was then NO way
  # to get a verdict for that commit short of pushing another one, which
  # means either fabricating a change or leaving HEAD unverified.
  #
  # Neither is acceptable when "CI green" is the bar for saying something
  # shipped. Two lines buy a re-trigger that needs no invented commit:
  #     gh workflow run tests --ref main
  workflow_dispatch:

jobs:
  cold-clone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # STDLIB ONLY, and this step is the assertion of it rather than a
      # comment claiming it. Every entrypoint here is meant to run with
      # nothing installed — an MCP client that spawns bin/llm-chat-mcp should
      # not need a `pip install` to talk to it — so if a dependency ever
      # creeps in, this job fails at import rather than in somebody's session.
      - name: no dependencies are installed, deliberately
        run: python3 -c "import sys; print(sys.version)"

      - name: suite, from a checkout that has never been built in
        run: python3 test/run.py

      # A SKIP IS NOT A PASS. Printed separately so the number is visible in
      # the log rather than folded into a green tick — a suite that quietly
      # skips its way to OK is the same shape as one nothing runs.
      - name: what was skipped and why
        if: always()
        run: |
          python3 test/run.py --tests-only 2>&1 \
            | grep -iE "skipped|skip:" || echo "nothing skipped"
